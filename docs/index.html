<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fragrance Values</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ef; --card:#fffdf9; --ink:#1f1b24; --muted:#6f6876; --line:#e7e0d6;
  --accent:#6b3f7a; --accent-soft:#efe6f2; --chip:#f0ebe3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141217; --card:#1d1a21; --ink:#f1edf4; --muted:#a59dac; --line:#2e2a34;
  --accent:#c79bd6; --accent-soft:#2c2232; --chip:#26222b;}}
:root[data-theme="dark"]{--bg:#141217; --card:#1d1a21; --ink:#f1edf4; --muted:#a59dac; --line:#2e2a34;
  --accent:#c79bd6; --accent-soft:#2c2232; --chip:#26222b;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header h1{font:650 30px/1.1 Fraunces,Georgia,serif;margin:6px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sub a{color:var(--accent);text-decoration:none;font-weight:600}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 8px}
.search input{width:100%;font:500 17px Inter,sans-serif;padding:13px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.plats[hidden]{display:none}
.plats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.plats .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.plat{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;
  font:500 13px Inter,sans-serif;cursor:pointer;text-decoration:line-through}
.plat.on{background:var(--accent);border-color:var(--accent);color:var(--card);text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.brand{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.name{font:600 17px/1.25 Fraunces,Georgia,serif}
.price{text-align:right;white-space:nowrap}
.price b{font:650 19px Fraunces,Georgia,serif;color:var(--accent)}
.price small{display:block;color:var(--muted);font-size:12px}
.detail{display:none;border-top:1px solid var(--line);padding:12px 16px 16px}
.card.open .detail{display:block}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;vertical-align:top;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
td small{color:var(--muted);font-size:12px}
tr.off td{color:var(--muted);opacity:.55}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip.k{color:var(--ink)}
h3{font:600 13px Inter,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.est{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.est input{width:64px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 15px Inter}
.est output{font:650 18px Fraunces,Georgia,serif;color:var(--accent);margin-left:auto}
a.s{color:var(--accent);text-decoration:none}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.more{display:block;margin:14px auto;background:none;border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:12px;font:500 14px Inter}
.more[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fragrance Values</h1>
    <div class="sub"><span id="meta">Loading…</span><a href="fragrance_values.xlsx" download>Excel ↓</a></div>
  </header>
  <div class="search">
    <input id="q" type="search" placeholder="Search — e.g. layton, br540, santal 33" autocomplete="off" autofocus>
    <div class="plats" id="plats"><span class="lbl">Price from:</span></div>
  </div>
  <div id="list"></div>
  <button class="more" id="more" hidden>Show more</button>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https:\/\//.test(u || "") ? esc(u) : "";
const shortDate = d => { if (!d) return ""; const [y, m, day] = d.split("-"); return `${+m}/${+day}/${y.slice(2)}`; };
const money = v => v == null ? "—" : "$" + (v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(2).replace(/\.00$/, ""));
const LABEL = {reddit: "Reddit", facebook: "Facebook", mercari: "Mercari"};
const CC = {n: "new", u: "used", d: "decant"};
const ALIAS = {pdm:"parfums de marly", mfk:"maison francis kurkdjian", br540:"baccarat rouge 540", br:"baccarat rouge",
  ysl:"yves saint laurent", tf:"tom ford", jpg:"jean paul gaultier", mm:"maison margiela", lv:"louis vuitton", bdc:"bleu de chanel"};
const norm = s => (s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
let DATA = [], SOURCES = [], ACTIVE = [], ON = {}, shown = 40;

// ---------- stats (mirror export.py) ----------
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function quartiles(s) {           // Python statistics.quantiles(n=4, method="exclusive")
  const n = s.length, m = n + 1;
  return [1, 2, 3].map(i => { let j = Math.floor(i * m / 4); const d = i * m - j * 4;
    j = Math.max(1, Math.min(n - 1, j)); return (s[j - 1] * (4 - d) + s[j] * d) / 4; });
}
function stats(prices) {
  let p = [...prices].sort((a, b) => a - b);
  if (p.length >= 5) { const [q1, , q3] = quartiles(p), k = 1.5 * (q3 - q1); p = p.filter(x => x >= q1 - k && x <= q3 + k); }
  return p.length ? {median: median(p), low: p[0], high: p[p.length - 1], n: p.length} : null;
}

// f.s rows: [day, price, size, fill, condClass, sourceIdx]
function compute(f) {
  const rows = f.s.filter(r => ON[SOURCES[r[5]]]);
  const groups = {};
  for (const r of rows) if (r[2]) (groups[Math.round(r[2]) + "|" + r[4]] ||= []).push(r);
  const sizes = Object.entries(groups).map(([k, rs]) => {
    const [size, c] = k.split("|"), st = stats(rs.map(r => r[1]));
    const fills = rs.map(r => r[3]).filter(x => x != null);
    return st && {size_ml: +size, cond: CC[c], ...st, avg_fill: fills.length ? Math.round(fills.reduce((a, b) => a + b) / fills.length) : null};
  }).filter(Boolean).sort((a, b) => a.size_ml - b.size_ml || a.cond.localeCompare(b.cond));
  const ppm = rs => { const s = stats(rs.filter(r => r[2] && r[3]).map(r => r[1] / (r[2] * r[3] / 100))); return s ? s.median : null; };
  return {n: rows.length, sizes, ppm: ppm(rows.filter(r => r[4] !== "d")), ppmDecant: ppm(rows.filter(r => r[4] === "d")),
          last: rows.length ? new Date(Math.max(...rows.map(r => r[0])) * 864e5).toISOString().slice(0, 10) : null};
}

function headline(c) {
  const b = c.sizes.filter(s => s.cond !== "decant").sort((a, b) => b.n - a.n)[0] || c.sizes[0];
  return b ? {v: b.median, l: `${b.size_ml}ml ${b.cond} · ${b.n} sold`, size: b.size_ml, cond: b.cond} : null;
}

function estimate(f, ml, fill) {
  const c = f._c;
  if (!ml) return null;
  const same = c.sizes.filter(s => s.size_ml === ml && s.cond !== "decant").sort((a, b) => b.n - a.n)[0];
  if (same) return same.median * (fill / (same.avg_fill || 100));
  return c.ppm ? c.ppm * ml * fill / 100 : null;
}

// ---------- rendering ----------
function platformTable(f, h) {
  // medians per platform for the headline size/condition, always shown so you can compare (off = greyed)
  const s = h && f.sizes.find(x => x.size_ml === h.size && x.cond === h.cond);
  const rows = ACTIVE.map(src => {
    const b = s && s.by_source[src], n = f.n_by_source[src] || 0;
    return `<tr class="${ON[src] ? "" : "off"}"><td>${LABEL[src]}</td><td class="r">${b ? `<b>${money(b.median)}</b>` : "—"}</td>
      <td class="r">${b ? b.n : 0}</td><td class="r">${n}</td></tr>`;
  }).join("");
  return `<h3>By platform${h ? ` · ${h.size}ml ${h.cond}` : ""}</h3><table><tr><th>Platform</th><th class="r">Median</th>
    <th class="r"># this size</th><th class="r"># total</th></tr>${rows}</table>`;
}

function card(f, i) {
  const c = f._c, h = headline(c);
  const sizes = c.sizes.map(s => `<tr><td>${s.size_ml} ml</td><td>${s.cond}${s.avg_fill && s.avg_fill < 99 ? ` · ~${s.avg_fill}%` : ""}</td>
    <td class="r"><b>${money(s.median)}</b></td><td class="r">${money(s.low)}–${money(s.high)}</td><td class="r">${s.n}</td></tr>`).join("");
  const line = r => `<tr><td style="white-space:nowrap">${shortDate(r.date)}</td>
    <td>${r.size_ml ? r.size_ml + "ml" : "?"}${r.fill != null ? " · " + Math.round(r.fill) + "%" : ""}<br><small>${esc((r.cond || "").replace("_", " "))}</small></td>
    <td>${r.pres ? esc(r.pres) : "<small>not stated</small>"}</td>
    <td class="r"><b>${money(r.price)}</b><br><small>${safeUrl(r.url) ? `<a class="s" href="${safeUrl(r.url)}" target="_blank" rel="noopener">${LABEL[r.source]} ↗</a>` : LABEL[r.source]}</small></td></tr>`;
  const head = `<tr><th>Date</th><th>Size · fill</th><th>Presentation</th><th class="r">Price</th></tr>`;
  const soldRows = f.recent.filter(r => ON[r.source]);
  const askRows = (f.asks || []).filter(r => ON[r.source]);
  const recent = soldRows.map(line).join("");
  const asking = askRows.map(line).join("");
  const defSize = h ? h.size : 100;
  return `<div class="card" data-i="${i}">
    <div class="row"><div><div class="brand">${esc(f.brand)}</div><div class="name">${esc(f.name)}</div></div>
      <div class="price"><b>${money(h ? h.v : f.ask_median)}</b><small>${h ? h.l : `asking · ${f.n_asks} listed`}</small></div></div>
    <div class="detail">
      <div class="chips"><span class="chip k">${c.n} sold</span>
        ${c.ppm ? `<span class="chip k">${money(c.ppm)}/ml bottle</span>` : ""}
        ${c.ppmDecant ? `<span class="chip">${money(c.ppmDecant)}/ml decant</span>` : ""}
        ${f.ask_median ? `<span class="chip">asking ${money(f.ask_median)} (${f.n_asks})</span>` : ""}
        ${c.last ? `<span class="chip">last ${c.last}</span>` : ""}</div>
      <div class="est">Value my bottle: <input type="number" inputmode="decimal" class="ml" value="${defSize}"> ml at
        <input type="number" inputmode="decimal" class="fill" value="100">% <output>—</output></div>
      ${recent ? `<h3>Every sale · ${soldRows.length}</h3><table>${head}${recent}</table>` : `<h3>Every sale</h3><p class="empty" style="padding:8px 0">No confirmed sales yet.</p>`}
      ${asking ? `<h3>Listed now, not sold · ${askRows.length}</h3><table>${head}${asking}</table>` : ""}
      ${sizes ? `<h3>Summary by size</h3><table><tr><th>Size</th><th>Cond.</th><th class="r">Median</th><th class="r">Range</th><th class="r">#</th></tr>${sizes}</table>` : ""}
      ${platformTable(f, h)}
    </div></div>`;
}

function render() {
  const open = new Set([...document.querySelectorAll(".card.open")].map(c => c.dataset.i));
  for (const f of DATA) f._c = compute(f);
  const toks = norm($("#q").value).split(" ").filter(Boolean).map(t => ALIAS[t] || t);
  const cur = DATA.filter(f => (f._c.n || f.n_asks) && toks.every(t => f._s.includes(t)))
                  .sort((a, b) => b._c.n - a._c.n);
  $("#list").innerHTML = cur.length ? cur.slice(0, shown).map(f => card(f, DATA.indexOf(f))).join("")
    : `<div class="empty">No sales found${toks.length ? ` for “${esc($("#q").value)}”` : ""} on the selected platforms.</div>`;
  open.forEach(i => { const c = document.querySelector(`.card[data-i="${i}"]`); if (c) c.classList.add("open"); });
  $("#more").hidden = cur.length <= shown;
  document.querySelectorAll(".card").forEach(updateEst);
}

function updateEst(c) {
  const f = DATA[c.dataset.i], o = c.querySelector("output");
  const v = estimate(f, +c.querySelector(".ml").value, +c.querySelector(".fill").value || 100);
  o.textContent = v ? "≈ " + money(v) : "not enough data";
}

function buildToggles(counts) {
  const box = $("#plats");
  if (ACTIVE.length < 2) { box.hidden = true; return; }  // nothing to toggle with one platform
  for (const src of ACTIVE) {
    const b = document.createElement("button");
    b.className = "plat" + (ON[src] ? " on" : "");
    b.textContent = `${LABEL[src]} · ${(counts[src] || 0).toLocaleString()}`;
    b.onclick = () => {
      if (ON[src] && Object.values(ON).filter(Boolean).length === 1) return; // keep at least one on
      ON[src] = !ON[src]; b.classList.toggle("on", ON[src]);
      try { localStorage.setItem("fragprice-platforms", JSON.stringify(ON)); } catch (e) {}
      render();
    };
    box.appendChild(b);
  }
}

$("#list").addEventListener("click", e => { const r = e.target.closest(".row"); if (r) r.parentElement.classList.toggle("open"); });
$("#list").addEventListener("input", e => { const c = e.target.closest(".card"); if (c) updateEst(c); });
$("#q").addEventListener("input", () => { shown = 40; render(); });
$("#more").addEventListener("click", () => { shown += 40; render(); });

fetch("data.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
  SOURCES = d.sources;
  ACTIVE = d.active || d.sources;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("fragprice-platforms") || "{}"); } catch (e) {}
  for (const s of SOURCES) ON[s] = !ACTIVE.includes(s) ? false : s in saved ? saved[s] : !(d.default_off || []).includes(s);
  DATA = d.fragrances.map(f => ({...f, _s: norm(f.brand + " " + f.name + " " + f.key)}));
  $("#meta").textContent = `${d.n_fragrances.toLocaleString()} fragrances · ${d.n_sales.toLocaleString()} sales · updated ${d.updated}`;
  buildToggles(d.n_by_source);
  render();
}).catch(() => $("#meta").textContent = "No data yet — run the workflow once.");
</script>
</body>
</html>
