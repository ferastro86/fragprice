<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fragrance Values</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ef; --card:#fffdf9; --ink:#1f1b24; --muted:#6f6876; --line:#e7e0d6;
  --accent:#6b3f7a; --accent-soft:#efe6f2; --good:#2f6b4f; --chip:#f0ebe3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141217; --card:#1d1a21; --ink:#f1edf4; --muted:#a59dac; --line:#2e2a34;
  --accent:#c79bd6; --accent-soft:#2c2232; --good:#7fc7a3; --chip:#26222b;}}
:root[data-theme="dark"]{--bg:#141217; --card:#1d1a21; --ink:#f1edf4; --muted:#a59dac; --line:#2e2a34;
  --accent:#c79bd6; --accent-soft:#2c2232; --good:#7fc7a3; --chip:#26222b;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header h1{font:650 30px/1.1 Fraunces,Georgia,serif;margin:6px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sub a{color:var(--accent);text-decoration:none;font-weight:600}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px}
.search input{width:100%;font:500 17px Inter,sans-serif;padding:13px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.brand{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.name{font:600 17px/1.25 Fraunces,Georgia,serif}
.price{text-align:right;white-space:nowrap}
.price b{font:650 19px Fraunces,Georgia,serif;color:var(--accent)}
.price small{display:block;color:var(--muted);font-size:12px}
.detail{display:none;border-top:1px solid var(--line);padding:12px 16px 16px}
.card.open .detail{display:block}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip.k{color:var(--ink)}
h3{font:600 13px Inter,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.est{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.est input{width:64px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 15px Inter}
.est out{font:650 18px Fraunces,Georgia,serif;color:var(--accent);margin-left:auto}
a.s{color:var(--accent);text-decoration:none}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.more[hidden]{display:none}
.more{display:block;margin:14px auto;background:none;border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:12px;font:500 14px Inter}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fragrance Values</h1>
    <div class="sub"><span id="meta">Loading…</span><a href="fragrance_values.xlsx" download>Excel ↓</a></div>
  </header>
  <div class="search"><input id="q" type="search" placeholder="Search — e.g. layton, br540, santal 33" autocomplete="off" autofocus></div>
  <div id="list"></div>
  <button class="more" id="more" hidden>Show more</button>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https:\/\//.test(u || "") ? esc(u) : "";
const money = v => v == null ? "—" : "$" + (v >= 100 ? Math.round(v) : v.toFixed(2).replace(/\.00$/, ""));
const ALIAS = {pdm:"parfums de marly", mfk:"maison francis kurkdjian", br540:"baccarat rouge 540", br:"baccarat rouge",
  ysl:"yves saint laurent", tf:"tom ford", jpg:"jean paul gaultier", mm:"maison margiela", lv:"louis vuitton", bdc:"bleu de chanel"};
const norm = s => (s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
let DATA = [], shown = 40, current = [];

function headline(f) {
  // most-traded full bottle size as the headline number
  const b = f.sizes.filter(s => s.cond !== "decant").sort((a, b) => b.n - a.n)[0] || f.sizes[0];
  return b ? {v: b.median, l: `${b.size_ml}ml ${b.cond} · ${b.n} sold`} : {v: f.ask_median, l: `asking · ${f.n_asks} listed`};
}

function estimate(f, ml, fill) {
  if (!ml) return null;
  const same = f.sizes.filter(s => s.size_ml === ml && s.cond !== "decant");
  if (same.length) {
    const s = same.sort((a, b) => b.n - a.n)[0];
    return s.median * (fill / (s.avg_fill || 100));
  }
  return f.ppm_bottle ? f.ppm_bottle * ml * fill / 100 : null;
}

function card(f, i) {
  const h = headline(f);
  const sizes = f.sizes.map(s => `<tr><td>${s.size_ml} ml</td><td>${s.cond}${s.avg_fill && s.avg_fill < 99 ? ` · ~${s.avg_fill}%` : ""}</td>
    <td class="r"><b>${money(s.median)}</b></td><td class="r">${money(s.low)}–${money(s.high)}</td><td class="r">${s.n}</td></tr>`).join("");
  const recent = f.recent.map(r => `<tr><td>${r.date || ""}</td><td>${r.size_ml ? r.size_ml + "ml" : "?"}${r.fill && r.fill < 99 ? " " + Math.round(r.fill) + "%" : ""} ${esc((r.cond||"").replace("_"," "))}</td>
    <td class="r">${money(r.price)}</td><td class="r">${safeUrl(r.url) ? `<a class="s" href="${safeUrl(r.url)}" target="_blank" rel="noopener">${r.source}</a>` : r.source}</td></tr>`).join("");
  const defSize = (f.sizes.find(s => s.cond !== "decant") || {}).size_ml || 100;
  return `<div class="card" data-i="${i}">
    <div class="row"><div><div class="brand">${esc(f.brand)}</div><div class="name">${esc(f.name)}</div></div>
      <div class="price"><b>${money(h.v)}</b><small>${h.l}</small></div></div>
    <div class="detail">
      <div class="chips"><span class="chip k">${f.n_sold} sold</span>
        ${f.ppm_bottle ? `<span class="chip k">${money(f.ppm_bottle)}/ml bottle</span>` : ""}
        ${f.ppm_decant ? `<span class="chip">${money(f.ppm_decant)}/ml decant</span>` : ""}
        ${f.ask_median ? `<span class="chip">asking ${money(f.ask_median)} (${f.n_asks})</span>` : ""}
        ${f.last_sold ? `<span class="chip">last ${f.last_sold}</span>` : ""}
        ${f.sources.map(s => `<span class="chip">${s}</span>`).join("")}</div>
      <div class="est">Value my bottle: <input type="number" inputmode="decimal" class="ml" value="${defSize}"> ml at
        <input type="number" inputmode="decimal" class="fill" value="100">% <output>—</output></div>
      ${sizes ? `<h3>Sold by size</h3><table><tr><th>Size</th><th>Cond.</th><th class="r">Median</th><th class="r">Range</th><th class="r">#</th></tr>${sizes}</table>` : ""}
      ${recent ? `<h3>Recent sales</h3><table>${recent}</table>` : ""}
    </div></div>`;
}

function render() {
  const q = norm($("#q").value).split(" ").map(t => ALIAS[t] || t).join(" ");
  const toks = q.split(" ").filter(Boolean);
  current = toks.length ? DATA.filter(f => toks.every(t => f._s.includes(t))) : DATA;
  $("#list").innerHTML = current.length ? current.slice(0, shown).map((f) => card(f, DATA.indexOf(f))).join("")
    : `<div class="empty">No sales found for “${esc($("#q").value)}”.</div>`;
  $("#more").hidden = current.length <= shown;
  document.querySelectorAll(".card").forEach(updateEst);
}

function updateEst(c) {
  const f = DATA[c.dataset.i], o = c.querySelector("output");
  const v = estimate(f, +c.querySelector(".ml").value, +c.querySelector(".fill").value || 100);
  o.textContent = v ? "≈ " + money(v) : "not enough data";
}

$("#list").addEventListener("click", e => { const r = e.target.closest(".row"); if (r) r.parentElement.classList.toggle("open"); });
$("#list").addEventListener("input", e => { const c = e.target.closest(".card"); if (c) updateEst(c); });
$("#q").addEventListener("input", () => { shown = 40; render(); });
$("#more").addEventListener("click", () => { shown += 40; render(); });

fetch("data.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
  DATA = d.fragrances.map(f => ({...f, _s: norm(f.brand + " " + f.name + " " + f.key)}));
  $("#meta").textContent = `${d.n_fragrances.toLocaleString()} fragrances · ${d.n_sales.toLocaleString()} sales · updated ${d.updated}`;
  render();
}).catch(() => $("#meta").textContent = "No data yet — run the workflow once.");
</script>
</body>
</html>
