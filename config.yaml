# ---------------------------------------------------------------
# fragprice config. Secret ANTHROPIC_API_KEY goes in
# GitHub repo Settings -> Secrets and variables -> Actions.
# ---------------------------------------------------------------

reddit:
  enabled: true
  subreddits: [fragranceswap]
  first_run_days: 30          # history pulled on the very first run (use --backfill-days for more)
  check_ages_days: [4, 21]    # read each post at 4 days old, re-read at 21 days (catches late SOLD edits)
  max_claude_calls: 600       # cap per run
  max_minutes: 40             # stop reading posts after this long; the rest wait for the next run
  skip_decant_posts: true     # don't send decant/split/sample-only posts to Claude (title check)
  exclude_conditions: [decant, sample]   # drop these items even when they appear on bottle posts
  # WTB / WTT / ISO posts are always skipped before Claude reads them

mercari:
  enabled: false              # off: Mercari blocks automated browsers (see README). Scraper kept for later.
  # Own scraper (Playwright Chromium). Searches mercari.com with the sold-only filter.
  headless: false             # false = real browser window under xvfb on Actions (harder to detect)
  max_items_per_keyword: 150   # x5 on backfill runs
  titles_per_call: 25         # Mercari titles batched per Claude call (cheap)
  keywords:
    - parfums de marly
    - creed aventus
    - le labo
    - maison francis kurkdjian
    - byredo
    - diptyque
    - initio
    - tom ford private blend
    - xerjoff
    - amouage
    - roja
    - kilian
    - nishane
    - louis vuitton parfum
    - dior privee
    - chanel les exclusifs
    - mancera
    - montale

facebook:
  enabled: false              # placeholder — implement fragprice/sources/facebook.py, then set true
  lookback: "12 days"          # each run rescrapes this window so SOLD edits/comments get picked up
  max_posts_per_group: 300
  check_ages_days: [4, 10]
  max_claude_calls: 400
  groups: []                   # for later: paste group URLs, e.g. - https://www.facebook.com/groups/123456789

valuation:
  default_off: []             # platforms unticked on the search page by default, e.g. [mercari]
  window_days: 365            # sales older than this are ignored
  min_confidence: 0.6         # drop items Claude wasn't sure about
