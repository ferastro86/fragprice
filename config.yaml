# ---------------------------------------------------------------
# fragprice config. Secrets (ANTHROPIC_API_KEY, APIFY_TOKEN) go in
# GitHub repo Settings -> Secrets and variables -> Actions.
# ---------------------------------------------------------------

reddit:
  enabled: true
  subreddits: [fragranceswap]
  first_run_days: 30          # history pulled on the very first run (use --backfill-days for more)
  check_ages_days: [4, 21]    # read each post at 4 days old, re-read at 21 days (catches late SOLD edits)
  max_claude_calls: 600       # cap per run

mercari:
  enabled: true
  # Apify actor for Mercari US sold listings (~$0.004 per item incl. sold dates).
  # {keyword}, {max_items}, {sold_within_days}, {search_url} are filled in.
  actor: "devilscrapes/mercari-sold-listings"
  actor_input:
    keyword: "{keyword}"
    soldOnly: true
    soldWithinDays: "{sold_within_days}"
    includeDetails: true
    maxResults: "{max_items}"
  sold_within_days: 3         # daily runs only fetch the last few days; backfill uses --backfill-days
  price_divisor: 1            # set to 100 if you swap to an actor that returns cents
  max_items_per_keyword: 150
  titles_per_call: 25         # Mercari titles batched per Claude call (cheap)
  keywords:
    - parfums de marly
    - creed aventus
    - le labo
    - maison francis kurkdjian
    - byredo
    - diptyque
    - initio
    - tom ford private blend
    - xerjoff
    - amouage
    - roja
    - kilian
    - nishane
    - louis vuitton parfum
    - dior privee
    - chanel les exclusifs
    - mancera
    - montale

facebook:
  enabled: true
  actor: "apify/facebook-groups-scraper"
  actor_input:
    startUrls: [{url: "{group_url}"}]
    resultsLimit: "{max_items}"
    viewOption: "CHRONOLOGICAL"
    onlyPostsNewerThan: "{newer_than}"
  lookback: "12 days"          # each run rescrapes this window so SOLD edits/comments get picked up
  max_posts_per_group: 300
  check_ages_days: [4, 10]
  max_claude_calls: 400
  groups: []                   # paste group URLs, e.g. - https://www.facebook.com/groups/123456789

valuation:
  window_days: 365            # sales older than this are ignored
  min_confidence: 0.6         # drop items Claude wasn't sure about
