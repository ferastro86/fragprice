name: Update fragrance values

on:
  schedule:
    - cron: "47 10 * * *"   # daily, ~5:47 AM Central
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma list (reddit,mercari,facebook) — blank = all enabled"
        required: false
        default: ""
      backfill_days:
        description: "Pull this many days of history (e.g. 365) — blank for a normal run"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fragprice
  cancel-in-progress: false

jobs:
  update:
    # Where it runs: set the repo variable RUNNER to "self-hosted" to use your home PC (sees live reddit.com:
    # SOLD flair and edits). Unset = GitHub's servers (archive copy only).
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300   # fetch (≤150) + batch wait (≤90) + overhead
    defaults:
      run:
        shell: bash        # on Windows this is Git Bash (installed with Git for Windows)
    env:
      PYTHONUTF8: "1"      # Windows: read/write files as UTF-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'   # the home PC uses its own installed Python
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Install Chromium (only when Mercari is enabled)
        run: |
          if python -c "import yaml,sys; sys.exit(0 if yaml.safe_load(open('config.yaml'))['mercari']['enabled'] else 1)"; then
            if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium && sudo apt-get install -y xvfb
            else python -m playwright install chromium; fi
          fi

      - name: Scrape, extract with Claude, export
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"   # show progress live in the Actions log
        run: |
          ARGS=""
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ inputs.sources }}"; fi
          if [ -n "${{ inputs.backfill_days }}" ]; then ARGS="$ARGS --backfill-days ${{ inputs.backfill_days }}"; fi
          if command -v xvfb-run >/dev/null; then RUN="xvfb-run -a"; else RUN=""; fi   # virtual display for Mercari's browser
          $RUN python -m fragprice.run $ARGS

      - name: Commit database and exports
        if: always()
        run: |
          git config user.name "fragprice-bot"
          git config user.email "fragprice-bot@users.noreply.github.com"
          git add data/fragprice.db docs/data.json docs/fragrance_values.xlsx
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update fragrance values $(date -u +%F)"
          git push
