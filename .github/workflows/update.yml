name: Update fragrance values

on:
  schedule:
    - cron: "47 10 * * *"   # daily, ~5:47 AM Central
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma list (reddit,mercari,facebook) — blank = all enabled"
        required: false
        default: ""
      backfill_days:
        description: "Pull this many days of history (e.g. 365) — blank for a normal run"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fragprice
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Chromium for the Mercari scraper
        run: python -m playwright install --with-deps chromium && sudo apt-get install -y xvfb

      - name: Scrape, extract with Claude, export
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ inputs.sources }}"; fi
          if [ -n "${{ inputs.backfill_days }}" ]; then ARGS="$ARGS --backfill-days ${{ inputs.backfill_days }}"; fi
          xvfb-run -a python -m fragprice.run $ARGS   # virtual display so Chromium can run non-headless

      - name: Commit database and exports
        if: always()
        run: |
          git config user.name "fragprice-bot"
          git config user.email "fragprice-bot@users.noreply.github.com"
          git add data/fragprice.db docs/data.json docs/fragrance_values.xlsx
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update fragrance values $(date -u +%F)"
          git push
